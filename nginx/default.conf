# API 전용: api.allbutyou.devnoco.com (FE 는 Vercel).
# 인증서: init-cert.sh 가 api.allbutyou.devnoco.com 으로 발급한다.

# 이름 없이(IP 직접) 들어온 요청은 응답 없이 끊는다
server {
    listen 80 default_server;
    listen 443 ssl default_server;

    ssl_certificate     /etc/letsencrypt/live/api.allbutyou.devnoco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.allbutyou.devnoco.com/privkey.pem;

    return 444;
}

server {
    listen 80;
    server_name api.allbutyou.devnoco.com;

    # certbot 갱신(http-01) 경로. 리다이렉트보다 먼저 매칭돼야 한다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── API (+ WebSocket /ws) ────────────────────────────
server {
    listen 443 ssl;
    server_name api.allbutyou.devnoco.com;

    ssl_certificate     /etc/letsencrypt/live/api.allbutyou.devnoco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.allbutyou.devnoco.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # STOMP WebSocket(/ws) 는 HTTP/1.1 Upgrade 가 필요하다
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 연결이 한동안 조용해도 끊지 않는다 (기본 60초)
        proxy_read_timeout 1h;
    }
}
