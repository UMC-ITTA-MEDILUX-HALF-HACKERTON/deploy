# 인증서 발급 전 부트스트랩용. 80 번 포트에서 ACME 챌린지만 받는다.
# TLS 설정을 얹으면 인증서가 없어 nginx 가 재시작 루프에 빠진다.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "allbutyou: waiting for certificate\n";
    }
}
